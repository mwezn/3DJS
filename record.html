<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Webcam Recorder</title>
</head>
<body>
 <h1>Webcam Recorder</h1>
 <video id="webcam" autoplay muted></video>
 <div>
   <button id="start-camera">Start Camera</button>
   <button id="stop-camera" disabled>Stop Camera</button>
   <button id="start-recording" disabled>Start Recording</button>
   <button id="stop-recording" disabled>Stop Recording</button>
   <a id="download-link" style="display: none;">Download Recording</a>
 </div>
 <script src="record.js"></script>
</body>
</html>
